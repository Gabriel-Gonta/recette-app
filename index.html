<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sèche</title>
  <meta name="theme-color" content="#131A2B">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sèche">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <div class="week">
        <button class="week-nav" id="prevWeek" aria-label="Semaine précédente">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="days" id="days" role="tablist" aria-label="Jours de la semaine"></div>
        <button class="week-nav" id="nextWeek" aria-label="Semaine suivante">
          <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
    </header>

    <main id="view" class="view"></main>

    <div class="timer" id="timer" hidden>
      <button class="timer-adj" data-adj="-15" aria-label="Retirer 15 secondes">−15</button>
      <div class="timer-core">
        <span class="timer-label">Repos</span>
        <span class="timer-time" id="timerTime">0:00</span>
      </div>
      <button class="timer-adj" data-adj="15" aria-label="Ajouter 15 secondes">+15</button>
      <button class="timer-skip" id="timerSkip" aria-label="Arrêter le minuteur">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <nav class="tabs" id="tabs" aria-label="Sections">
      <button data-tab="salle" class="tab">
        <svg viewBox="0 0 24 24"><path d="M3 9v6M6.5 6.5v11M17.5 6.5v11M21 9v6M6.5 12h11"/></svg>
        <span>Salle</span>
      </button>
      <button data-tab="repas" class="tab">
        <svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0zM8 3c0 2 2 2 2 4M12 3c0 2 2 2 2 4"/></svg>
        <span>Repas</span>
      </button>
      <button data-tab="courses" class="tab">
        <svg viewBox="0 0 24 24"><path d="M5 7h14l-1.5 12h-11zM9 7a3 3 0 0 1 6 0"/></svg>
        <span>Courses</span>
      </button>
      <button data-tab="suivi" class="tab">
        <svg viewBox="0 0 24 24"><path d="M4 19h16M6 15l4-5 3 3 5-7"/></svg>
        <span>Suivi</span>
      </button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-grip" id="sheetGrip"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
